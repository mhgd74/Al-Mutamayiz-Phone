<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتميز ستور — كل اللينكات</title>
<!--
  نظام التصميم:
  - الألوان: خلفية فحمية غامقة #1F262C (من خلفية اللوجو)، أحمر البراند #E5222B، أبيض
  - الخط: IBM Plex Sans Arabic للنصوص (مع Segoe UI كخطة بديلة)، Changa للعناوين
  - الإيقاع: عمود مركزي بعرض 400px، أزرار بارتفاع 64px، مسافات 14px
  - الأيقونات: SVG دائري بلون كل منصة، تتفاعل عند الهوفر
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Changa:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1F262C;
    --surface: #29323A;
    --surface-hover: #2F3942;
    --line: rgba(255,255,255,.07);
    --brand-red: #E5222B;
    --text: #F5F7F8;
    --muted: #97A3AD;
    --tiktok: #101014;
    --whatsapp: #25D366;
    --phone: #3A8DDE;
    --instapay-a: #5B2D90;
    --instapay-b: #B24BF3;
    --fawry: #FFC220;
    --location: #E5222B;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    display:flex; justify-content:center;
    min-height:100%;
    position:relative;
    overflow-x:hidden;
  }
  /* توهج خفيف جداً بلون البراند خلف اللوجو — مش خلفية متدرجة صارخة */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(420px 300px at 50% -60px, rgba(229,34,43,.16), transparent 70%),
      radial-gradient(500px 400px at 50% 110%, rgba(229,34,43,.07), transparent 70%);
    pointer-events:none;
  }

  .page{
    width:100%; max-width:400px;
    padding: 44px 22px 40px;
    display:flex; flex-direction:column; align-items:center;
    position:relative; z-index:1;
  }

  /* ---- الترويسة ---- */
  header{ text-align:center; margin-bottom:22px; }
  .logo{
    width:150px; height:150px;
    object-fit:contain;
    filter: drop-shadow(0 14px 30px rgba(0,0,0,.45));
    animation: pop .6s cubic-bezier(.2,.9,.3,1.2) both;
  }
  h1{
    font-family:"Changa", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    font-weight:800; font-size:30px;
    margin-top:12px; letter-spacing:.3px;
    animation: fadeUp .5s .12s ease both;
  }
  h1 .accent{ color: var(--brand-red); }
  .tagline{
    color: var(--muted); font-size:14.5px; margin-top:4px; line-height:1.6;
    animation: fadeUp .5s .2s ease both;
  }

  /* ---- شارة صغيرة زي شارة "تو" في اللوجو ---- */
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--brand-red); color:#fff;
    font-size:12px; font-weight:700;
    padding:5px 13px; border-radius:999px;
    margin-bottom:16px;
    animation: fadeUp .5s .28s ease both;
  }

  /* ---- اللينكات ---- */
  .links{ width:100%; display:flex; flex-direction:column; gap:12px; }
  .link{
    display:flex; align-items:center; gap:14px;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding: 11px 14px;
    min-height:64px;
    text-decoration:none; color:var(--text);
    font-family:inherit; font-size:inherit;
    text-align:right; width:100%;
    cursor:pointer;
    transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    animation: fadeUp .55s ease both;
  }
  .link:nth-child(1){ animation-delay:.34s; }
  .link:nth-child(2){ animation-delay:.42s; }
  .link:nth-child(3){ animation-delay:.5s; }
  .link:nth-child(4){ animation-delay:.58s; }
  .link:nth-child(5){ animation-delay:.66s; }

  .link:hover{
    transform: translateY(-3px);
    background: var(--surface-hover);
  }
  .link:active{ transform: translateY(-1px) scale(.99); }

  .icon{
    width:46px; height:46px; flex:0 0 46px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition: background .18s ease, box-shadow .18s ease, color .18s ease;
  }
  .icon svg{ width:24px; height:24px; display:block; }

  .txt{ flex:1; min-width:0; }
  .txt b{ display:block; font-size:17px; font-weight:700; line-height:1.3; }
  .txt small{ display:block; color:var(--muted); font-size:12.5px; margin-top:2px; direction:ltr; text-align:right; }
  .link.whatsapp .txt small,
  .link.instapay .txt small,
  .link.location .txt small{ direction:rtl; }
  .txt small .num{ direction:ltr; unicode-bidi:embed; }

  .arrow{
    width:22px; height:22px; flex:0 0 22px;
    color: var(--muted);
    transition: transform .18s ease, color .18s ease;
  }
  .arrow svg{ width:100%; height:100%; }
  .link:hover .arrow{ transform: translateX(-4px); color:var(--text); }

  /* لون كل منصة يظهر عند الهوفر */
  .link.tiktok .icon{ background:#3A3A42; color:#fff; }
  .link.tiktok:hover{ border-color: rgba(255,255,255,.25); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  .link.tiktok:hover .icon{ background: var(--tiktok); box-shadow: 0 0 0 3px rgba(255,255,255,.08); }

  .link.whatsapp .icon{ background:#1F3D2C; color:var(--whatsapp); }
  .link.whatsapp:hover{ border-color: rgba(37,211,102,.45); box-shadow: 0 10px 26px rgba(37,211,102,.12); }
  .link.whatsapp:hover .icon{ background: var(--whatsapp); color:#fff; box-shadow: 0 0 0 3px rgba(37,211,102,.2); }

  .link.phone .icon{ background:#22303C; color:var(--phone); }
  .link.phone:hover{ border-color: rgba(58,141,222,.5); box-shadow: 0 10px 26px rgba(58,141,222,.14); }
  .link.phone:hover .icon{ background: var(--phone); color:#fff; box-shadow: 0 0 0 3px rgba(58,141,222,.18); }

  .link.instapay .icon{ background:#2E2340; color:#D9B8FF; }
  .link.instapay:hover{ border-color: rgba(178,75,243,.5); box-shadow: 0 10px 26px rgba(178,75,243,.15); }
  .link.instapay:hover .icon{
    background: linear-gradient(135deg, var(--instapay-a), var(--instapay-b));
    color:#fff; box-shadow: 0 0 0 3px rgba(178,75,243,.18);
  }
  .link.instapay.copied{ border-color: rgba(37,211,102,.5); }
  .link.instapay.copied .txt small{ color: var(--whatsapp); }

  .link.location .icon{ background:#3A2226; color:#FF7B81; }
  .link.location:hover{ border-color: rgba(229,34,43,.55); box-shadow: 0 10px 26px rgba(229,34,43,.14); }
  .link.location:hover .icon{ background: var(--location); color:#fff; box-shadow: 0 0 0 3px rgba(229,34,43,.2); }

  /* ---- وسائل الدفع ---- */
  .payhead{
    margin: 22px 0 10px;
    color: var(--muted); font-size:12.5px; font-weight:700; letter-spacing:.4px;
    animation: fadeUp .55s .74s ease both;
  }
  .payrow{ display:flex; gap:8px; width:100%; animation: fadeUp .55s .8s ease both; }
  .paychip{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    background: var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:9px 6px;
    font-size:13px; font-weight:700; color:var(--text);
  }
  .paychip i{ width:8px; height:8px; border-radius:50%; flex:0 0 8px; }
  .paychip.insta i{ background: linear-gradient(135deg, var(--instapay-a), var(--instapay-b)); }
  .paychip.voda i{ background:#E60000; }
  .paychip.fawry i{ background: var(--fawry); }

  /* ---- شريط سفلي ---- */
  footer{
    margin-top:24px; text-align:center;
    animation: fadeUp .55s .88s ease both;
  }
  .phone-chip{
    display:inline-flex; align-items:center; gap:8px;
    color:var(--muted); text-decoration:none;
    font-size:13.5px; font-weight:500;
    padding:8px 16px; border-radius:999px;
    border:1px dashed rgba(255,255,255,.14);
    transition: color .15s ease, border-color .15s ease;
  }
  .phone-chip:hover{ color:var(--text); border-color: rgba(229,34,43,.55); }
  .phone-chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--whatsapp); box-shadow:0 0 8px var(--whatsapp); }

  /* ---- حركات ---- */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes pop{ from{ opacity:0; transform:scale(.85);} to{ opacity:1; transform:scale(1);} }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<main class="page">

      </span>
      <span class="txt">

    <!-- تليفون -->
    <a class="link phone" href="tel:+201005223583">

    <!-- انستاباي: نسخ الرقم للحوالة -->
    <button class="link instapay" id="instapay" type="button" data-num="01126576008">

  <p class="payhead">وسائل الدفع المتاحة</p>
  <div class="payrow">
    <span class="paychip insta"><i></i>انستاباي</span>
    <span class="paychip voda"><i></i>فودافون كاش</span>
    <span class="paychip fawry"><i></i>فوري</span>
  </div>


</main>

<script>
  // زرار انستاباي: نسخ الرقم للحوالة مع رسالة تأكيد
  const btn = document.getElementById("instapay");
  const sub = btn.querySelector("small");
  const origText = sub.dataset.orig;
  let t = null;
  btn.addEventListener("click", async () => {
    const num = btn.dataset.num;
    try {
      await navigator.clipboard.writeText(num);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = num;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select(); document.execCommand("copy");
      ta.remove();
    }
    sub.innerHTML = "اتنسخ &mdash; حوّل دلوقتي على انستاباي";
    btn.classList.add("copied");
    clearTimeout(t);
    t = setTimeout(() => {
      sub.innerHTML = origText;
      btn.classList.remove("copied");
    }, 2400);
  });
</script>
</body>
